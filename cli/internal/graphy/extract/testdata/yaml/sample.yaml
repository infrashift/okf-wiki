version: "3.9"

services:
  web:
    build: ./web
    entrypoint: scripts/start.sh
    image: registry.example.com/web:latest
  db:
    image: postgres:16
    volumes:
      - ./data:/var/lib/postgresql/data

x-scripts:
  deploy: ../tools/deploy.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          command: ["/bin/server"]
