name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -race needs CGo; okfw itself is pure Go and is built without it below
      # to keep that guarantee honest. -race matters here because the compiled
      # concept schema is a process-wide sync.Once value shared across every
      # validation.
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./cli/... -count=1 -race -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Vet
        run: go vet ./cli/...

      # gofmt and tidy drift are cheap to catch and annoying to discover later.
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l ./cli)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is current
        run: go mod tidy -diff

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Build okfw without CGo
        env:
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cli/cmd/okfw

      # `cue vet` on the schema alone type-checks it against no data instance, so
      # it cannot catch a concept that violates #Concept. It is kept only as a
      # syntax gate; the real conformance check is
      # cli/internal/config/fixtures_test.go, which validates the fixture corpus
      # against the compiled schema as part of the suite above.
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@latest

      - name: Validate CUE schema syntax
        run: cue vet ./cli/internal/config/concept-schema.cue

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      # The Neovim plugin is a first-class surface: it shells out to the same
      # commands, so a stale reference there is a real break.
      - name: Luacheck
        run: luacheck lua/ plugin/ test/

  # The Lua suite drives the real okfw binary through the plugin, so it catches
  # a plugin calling a command or flag the CLI no longer has — which luacheck
  # cannot. Run at the plugin's floor (plugin/okfw.lua requires 0.9) and at the
  # version the e2e image and devcontainer use.
  neovim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.9.5, v0.11.4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Plugin integration suite
        run: make integration-test
